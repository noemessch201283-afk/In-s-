
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Inès</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: linear-gradient(-45deg, #180d25, #541b42, #24133d, #7a2850);
  background-size: 400% 400%;
  animation: fond 12s ease infinite;
}

@keyframes fond {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.contenu {
  padding: 30px;
  animation: apparition 2s ease;
  z-index: 2;
}

h1 {
  color: #ffb6d5;
  font-size: 42px;
  animation: lumiere 2s infinite alternate;
}

p {
  font-size: 21px;
  line-height: 1.6;
}

button {
  margin-top: 25px;
  padding: 16px 28px;
  border: 1px solid #ffb6d5;
  border-radius: 30px;
  background: #a83c70;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: transform .3s, background .3s;
}

button:active {
  transform: scale(.9);
}

#message {
  margin-top: 25px;
  color: #ffc5df;
  font-size: 27px;
  display: none;
  animation: apparition 1s ease;
}

.coeur {
  position: absolute;
  bottom: -40px;
  color: #ff9bc8;
  opacity: .7;
  animation: monter 9s linear infinite;
}

@keyframes monter {
  to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

@keyframes apparition {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes lumiere {
  from { text-shadow: 0 0 5px #ff9bc8; }
  to { text-shadow: 0 0 25px #ff4eaa; }
}
</style>
</head>
<body>

<div class="contenu">
  <h1>Je t'aime Inès</h1>
  <p>J'espère vite te voir<br>
  pour te faire plein de câlins.</p>

  <button onclick="document.getElementById('message').style.display='block'; this.style.display='none';">
    Clique ici
  </button>

  <div id="message">On peut doro ?</div>
</div>

<script>
for (let i = 0; i < 18; i++) {
  let coeur = document.createElement("div");
  coeur.className = "coeur";
  coeur.textContent = "♥";
  coeur.style.left = Math.random() * 100 + "vw";
  coeur.style.animationDelay = Math.random() * 9 + "s";
  coeur.style.fontSize = (15 + Math.random() * 20) + "px";
  document.body.appendChild(coeur);
}
</script>

</body>
</html>
